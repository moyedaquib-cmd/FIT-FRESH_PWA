{% extends "base.html" %}
{% block title %}Register — Fit & Fresh{% endblock %}
{% block content %}
<div class="page-sm">
    <div class="auth-logo">
        <div class="auth-logo-text">FIT<span>&</span>FRESH</div>
        <p style="color:var(--text-muted);font-size:0.9rem;margin-top:0.25rem;">Create your account to get started.</p>
    </div>
    <div class="form-card">
        <form action="/register" method="POST">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Choose a password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword()">👁</button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">I am a...</label>
                <select name="role" class="form-control" required>
                    <option value="gym_goer">Gym Goer</option>
                    <option value="trainer">Personal Trainer</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:0.5rem;">Create Account</button>
        </form>
    </div>
    <p class="auth-switch">Already have an account? <a href="/login">Log in here</a></p>
</div>
<script>
function togglePassword() { const p = document.getElementById("password"); p.type = p.type === "password" ? "text" : "password";}
</script>
{% endblock %}
