{% extends "base.html" %}
{% block title %}Register — Fit & Fresh{% endblock %}
{% block content %}
<div class="page-sm bg-image bg-home">
    <div class="auth-logo">
        <div class="auth-logo-text">FIT<span>&</span>FRESH</div>
        <p style="color:var(--text-muted);font-size:0.9rem;margin-top:0.25rem;">Create your account to get started.</p>
    </div>
    <div class="form-card">
        <form action="/register" method="POST" id="registerForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Choose a username" required>
                 <p class="field-error" id="usernameErr"></p>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Choose a password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword()">👁</button>
                </div>
                <div class="strength-bar-wrap"><div class="strength-bar" id="strengthBar"></div></div>
                <p class="strength-label" id="strengthLabel"></p>
                <p class="field-error" id="passwordErr"></p>
            </div>
            <div class="form-group">
                <label class="form-label">I am a...</label>
                <select name="role" class="form-control" required>
                    <option value="gym_goer">Gym Goer</option>
                    <option value="trainer">Personal Trainer</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:0.5rem;">Create Account</button>
        </form>
    </div>
    <p class="auth-switch">Already have an account? <a href="/login">Log in here</a></p>
</div>
{% endblock %}
{% block head %}
<script>
    function togglePassword() { const p = document.getElementById("password"); p.type = p.type === "password" ? "text" : "password";}

    document.addEventListener('DOMContentLoaded', () => {
        const username = document.getElementById('username');
        const usernameErr = document.getElementById('usernameErr');
        username.addEventListener('input', () => {
            const val = username.value.trim();
            let msg = '';
            if (val.length < 3) msg = 'Username must be at least 3 characters';
            else if (val.length > 50) msg = 'Username must be under 50 characters';
            else if (!/^[a-zA-Z0-9_]+$/.test(val)) msg = 'Only letters, numbers and underscores allowed';
            usernameErr.textContent = msg;
            username.classList.toggle('input-error', !!msg);
            username.classList.toggle('input-valid', !msg && val.length > 0);
        });
 
        const password = document.getElementById('password');
        const bar = document.getElementById('strengthBar');
        const label = document.getElementById('strengthLabel');
        const passErr = document.getElementById('passwordErr');
        const colours = ['#ef4444', '#f59e0b', '#3b82f6', '#10b981'];
        const labels  = ['Too short', 'Weak', 'Good', 'Strong'];
 
        password.addEventListener('input', () => {
            const val = password.value;
            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^a-zA-Z0-9]/.test(val)) score++;
            const pct = val.length === 0 ? 0 : Math.max(1, score) * 25;
            bar.style.width = pct + '%';
            bar.style.background = val.length === 0 ? 'transparent' : colours[Math.max(0, score - 1)];
            label.textContent = val.length === 0 ? '' : labels[Math.max(0, score - 1)];
            label.style.color = val.length === 0 ? '' : colours[Math.max(0, score - 1)];
            const msg = val.length < 6 ? 'Password must be at least 6 characters' : '';
            passErr.textContent = msg;
            password.classList.toggle('input-error', !!msg && val.length > 0);
            password.classList.toggle('input-valid', !msg && val.length > 0);
        });
        form.addEventListener('submit', (e) => {
            const uVal = username.value.trim();
            const pVal = password.value;
            let blocked = false;
            if (uVal.length < 3 || uVal.length > 50 || !/^[a-zA-Z0-9_]+$/.test(uVal)) {
                usernameErr.textContent = 'Please enter a valid username (3-50 chars, letters/numbers/underscores)';
                username.classList.add('input-error');
                blocked = true;
            }
            
            if (pVal.length < 6) {
                passErr.textContent = 'Password must be at least 6 characters';
                password.classList.add('input-error');
                blocked = true;
            }
            if (blocked) e.preventDefault(); 
        });
    });
</script>
{% endblock %}
