<!DOCTYPE html>
<html lang = "en"> 
    <head> 
        <meta charset="UTF-8"> 
        <title>Fit & Fresh</title>
    </head>
    <body> 
        {% with messages = get_flashed_messages() %} 
            {% if messages %}
                <ul style="color: green;"> 
                    {% for message in messages %} 
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        <h1>WELCOME to Fit&Fresh!</h1> <!--Introduces the PWA-->
        <a href="/register">Register</a> <!--Link to the register page-->
        <a href="/login">Login</a> <!--Link to the login page-->
    </body>
</html>
