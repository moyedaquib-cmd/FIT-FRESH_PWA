{% extends "base.html" %}
{% block title %}Log Workout — Fit & Fresh{% endblock %}
{% block content %}
<div class="page-sm">
    <a href="{{ url_for('gym_goer_dashboard') if session.role == 'gym_goer' else url_for('personal_trainer_dashboard') }}" class="back-link">← Back to Dashboard</a>
    <h2 style="margin-bottom:1.5rem;">Log Workout</h2>
    <div class="form-card">
        <form action="/log-workout" method="POST">
            <div class="form-group">
                <label class="form-label">Exercise Name</label>
                <input type="text" name="exercise" class="form-control" placeholder="e.g. Bench Press" required>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
                <div class="form-group">
                    <label class="form-label">Sets</label>
                    <input type="number" name="sets" class="form-control" placeholder="4" min="1" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Reps</label>
                    <input type="number" name="reps" class="form-control" placeholder="8" min="1" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Weight (kg)</label>
                    <input type="number" name="weight" class="form-control" placeholder="60" step="0.1" min="0" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full btn-lg">Save Workout</button>
        </form>
    </div>
</div>
{% endblock %}
