{% extends "base.html" %}
{% block title %}Add Meal Plan — Fit & Fresh{% endblock %}
{% block content %}
<div class="page-sm">
    <a href="{{ url_for('personal_trainer_dashboard') }}" class="back-link">← Back to Dashboard</a>
    <h2 style="margin-bottom:1.5rem;">Diet</h2>
    <div class="form-card">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Plan Name</label>
                <input name="name" class="form-control" placeholder="e.g. 2500 Cal Muscle Building Plan" required>
            </div>
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" placeholder="Describe this meal plan and who it's for..." required></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Meals</label>
                <p class="form-hint" style="margin-bottom:0.4rem;">List each meal on a new line</p>
                <textarea name="meals" class="form-control" rows="8" placeholder="Breakfast: Oats with protein powder&#10;Snack: Greek yoghurt&#10;Lunch: Chicken rice and veg&#10;..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Add Meal Plan</button>
        </form>
    </div>
</div>
{% endblock %}
