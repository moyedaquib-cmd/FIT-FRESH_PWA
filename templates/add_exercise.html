{% extends "base.html" %}
{% block title %}Add Exercise — Fit & Fresh{% endblock %}
{% block content %}
<div class="page-sm">
    <a href="{{ url_for('personal_trainer_dashboard') }}" class="back-link">← Back to Dashboard</a>
    <h2 style="margin-bottom:1.5rem;">Add Exercise</h2>
    <div class="form-card">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Exercise Name</label>
                <input name="name" class="form-control" placeholder="e.g. Barbell Back Squat" required>
            </div>
            <div class="form-group">
                <label class="form-label">Form</label>
                <textarea name="description" class="form-control" placeholder="Describe the exercise and how to perform it..." required></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Muscle Group</label>
                <input name="muscle_group" class="form-control" placeholder="e.g. Quadriceps, Glutes" required>
            </div>
            <div class="form-group">
                <label class="form-label">Image URL <span style="color:var(--text-dim);font-weight:400;text-transform:none;">(optional)</span></label>
                <input name="image_url" class="form-control" placeholder="https://example.com/image.jpg">
            </div>
            <div class="form-group">
                <label class="form-label">Difficulty</label>
                <select name="difficulty" class="form-control" required>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Add Exercise</button>
        </form>
    </div>
</div>
{% endblock %}
