{% extends "base.html" %}
{% block title %}Add Routine — Fit & Fresh{% endblock %}
{% block content %}
<div class="page-sm">
    <a href="{{ url_for('personal_trainer_dashboard') }}" class="back-link">← Back to Dashboard</a>
    <h2 style="margin-bottom:1.5rem;">Add Workout Routine</h2>
    <div class="form-card">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Routine Name</label>
                <input name="name" class="form-control" placeholder="e.g. 4-Day Upper/Lower Split" required>
            </div>
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" placeholder="Describe this routine and who it's designed for..." required></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Difficulty</label>
                <select name="difficulty" class="form-control" required>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Exercises</label>
                <p class="form-hint" style="margin-bottom:0.4rem;">List each exercise on a new line</p>
                <textarea name="exercises_list" class="form-control" rows="8" placeholder="Barbell Back Squat — 4x6&#10;Romanian Deadlift — 3x10&#10;Leg Press — 3x12&#10;..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Add Routine</button>
        </form>
    </div>
</div>
{% endblock %}
