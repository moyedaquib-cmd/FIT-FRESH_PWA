{% extends "base.html" %}
{% block title %}Login — Fit & Fresh{% endblock %}
{% block content %}
<div class="page-sm bg-image bg-home">
    <div class="auth-logo">
        <div class="auth-logo-text">FIT<span>&</span>FRESH</div>
        <p style="color:var(--text-muted);font-size:0.9rem;margin-top:0.25rem;">Welcome back. Log in to continue.</p>
    </div>
    <div class="form-card">
        <!-- Submits credentials securely via form headers to the server login route handler -->
        <form action="/login" method="POST">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Enter your username" required>
                <p class="field-error" id="usernameErr"></p>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword()">👁</button> <!-- Password visibility toggle -->
                </div>
                <p class="field-error" id="passwordErr"></p>
            </div>
            <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:0.5rem;">Log In</button>
        </form>
    </div>
    <!-- Allows user to go straight over to account registration-->
    <p class="auth-switch">Don't have an account? <a href="/register">Register here</a></p>
</div>
{% endblock %}
{% block head %}
<!-- Standard frontend script handling raw input visibility toggles and format validation rules -->
<script>

    // Flips the layout element input visibility type between hidden character and raw text
    function togglePassword() {const p = document.getElementById("password"); p.type = p.type === "password" ? "text" : "password";}
    document.addEventListener('DOMContentLoaded', () => {
        function validate(id, errId, checks) {
            const el = document.getElementById(id);
            const err = document.getElementById(errId);
            if (!el) return;
            el.addEventListener('input', () => {
                const val = el.value.trim();
                let msg = '';
                // Checks structural properties to make sure text fields are filled prior to sending to database
                for (const [test, message] of checks) {
                    if (!test(val)) { msg = message; break; }
                }
                err.textContent = msg;
                el.classList.toggle('input-error', !!msg && val.length > 0);
                el.classList.toggle('input-valid', !msg && val.length > 0);
            });
        }
        validate('username', 'usernameErr', [[v => v.length >= 1, 'Please enter your username']]);
        validate('password', 'passwordErr', [[v => v.length >= 1, 'Please enter your password']]);
    });
</script>
{% endblock %}
